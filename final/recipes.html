<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes on Easy Taste</title>
    <meta name="description" content="Discover 20+ delicious recipes with a single click. Filter by tags or use our search to find your next favorite meal!">
    <meta name="author" content="Alvin Timaná">
    <!-- SOCIAL MEDIA -->
    <meta property="og:title" content="Recipes on Easy Taste, discover delicious recipes.">
    <meta property="og:description" content="Discover 20+ delicious recipes with a single click. Filter by tags or use our search to find your next favorite meal!">
    <meta property="og:image" content="https://alpha-lantern.github.io/wdd231/final/images/og-img.webp">
    <meta property="og:image:alt" content="Webpage preview">
    <meta property="og:url" content="https://alpha-lantern.github.io/wdd231/final/recipes.html">
    <meta property="og:type" content="website">
    <!-- ICON -->
    <link rel="icon" href="images/favicon.ico">
    <!-- Normalize CSS file -->
    <link rel="stylesheet" href="styles/normalize.css">
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Noto+Serif:wght@200&family=Open+Sans:wght@300..800&display=swap" rel="stylesheet">
    <!-- STYLES -->
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/medium.css">
    <link rel="stylesheet" href="styles/large.css">
    <!-- SCRIPTS -->
    <script src="scripts/navigation.js" defer></script>
    <script type="module" src="scripts/dates.mjs"></script>
    <script type="module" src="scripts/display-recipes.mjs"></script>
    <script src="scripts/form-modal.js" defer></script>
</head>
<body>
    <!-- HEADER -->
    <header>
        <section class="header">
            <img class="logo" src="images/logo.svg" alt="Easy Taste logo" width="1" height="1">
            <h2 class="logo-name">Easy Taste</h2>
            <button id="ham-btn" class="hamburger" aria-label="Menu"></button>
        </section>
    </header>
    <!-- NAVIGATION -->
    <nav id="nav-bar" class="navigation">
        <ul>
            <li><a class="nav-hover" href="index.html">Home</a></li>
            <li><a class="nav-hover current" href="recipes.html">Recipes</a></li>
            <li><a class="nav-hover" href="favorites.html">Favorites</a></li>
        </ul>
    </nav>
    <!-- MAIN -->
    <main>
        <div class="hero">
            <picture>
                <source media="(min-width: 60rem)" srcset="images/food-hero-l.webp">
                <source media="(min-width: 40rem)" srcset="images/food-hero-m.webp">
                <img src="images/food-hero-s.webp" alt="Picture of food ingredients" width="960" height="480">
            </picture>
            <form id="recipeSearch" class="hero-search" action="recipes.html" method="get">
                <h2>Find Your Next Meal</h2>
                <label class="strong" for="byRecipe">Search by Name</label>
                <input type="text" id="byRecipe" title="Recipe name" name="recipe-name" placeholder="Ex: Banana Pancakes">
                <button class="standard-hover" title="Search recipe">Search</button>
                <label class="strong" for="byIngredients">Search by Ingredients</label>
                <input type="text" id="byIngredients" title="Ingredients you have" name="ingredients" placeholder="Ex: Banana, milk, etc">
                <input type="text" id="recipeId" name="id" value="" hidden>
                <button class="standard-hover" title="Search by the ingredients">Find Dishes</button>
            </form>
        </div>
        <section class="container">
            <h1 id="recipeName">Recipes</h1>
            <section class="container">
                <h2 id="filterName"></h2>
                <div class="recipe-list" id="searchResult"></div>
            <section class="container">
                <h2>Explore More Recipes</h2>
                <div class="recipe-card" id="recipesList"></div>
            </section>
            </section>
            <section class="container">
                <h2>Can't Find What You're Looking For?</h2>
                <button class="open-button strong standard-hover" id="requestButton">Request a Recipe</button>
                <dialog id="formModal" class="modal">
                    <form action="thankyou.html" id="request" class="request" method="get">
                        <fieldset>
                            <legend class="strong">Request a Recipe</legend>
                            <label for="requestName">Recipe Name*</label>
                            <input type="text" title="Recipe Name" name="recipe-name" id="requestName" required>
                            <label for="requestDescription">Brief Description*</label>
                            <textarea title="Description" name="description" id="requestDescription" rows="4" required></textarea>
                            <label for="email">Email</label>
                            <input type="email" id="email" title="email" name="email">
                            <button class="strong standard-hover">Send Request</button>
                            <button type="button" id="closeButton" class="strong standard-hover close-btn">Close</button>
                        </fieldset>
                    </form>
                </dialog>
            </section>
        </section>
    </main>
    <!-- FOOTER -->
    <footer>
        <section class="footer">
            
            <h2 class="logo-name">Easy Taste</h2>
            <div class="contact-info">
                <p>info_easytaste@mail.com</p>
                <p>+51 932445023</p>
                <p><a href="attributions.html">Attributions</a></p>
                <p><a target="_blank" href="https://www.loom.com/share/a48b62c05dbd4865b2fca56f5fce8f12">Video Demonstration</a></p>
            </div>
            <div class="social">
                <a href="https://github.com/alpha-lantern/wdd231" target="_blank"><img src="images/github.svg" alt="Github icon" width="32" height="32"></a>
                <a href="https://www.linkedin.com/in/alvin-timana" target="_blank"><img src="images/linkedin.svg" alt="Linkedin icon" width="32" height="32"></a>
                <a href="https://www.facebook.com/alvinjoel.timanasolier/" target="_blank"><img src="images/facebook.svg" alt="Facebook icon" width="32" height="32"></a>
            </div>
            <div class="my-info">
                <p><span id="currentYear"></span> · Alvin Timaná · WDD 231 · Lima, Perú</p>
                <p id="lastModified"></p>
            </div>
        </section>
    </footer>
</body>
</html>
