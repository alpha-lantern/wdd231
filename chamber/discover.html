<body>

            <button id="dark-mode" class="dark" aria-label="Dark mode"></button>
            <button id="ham-btn" class="hamburger" aria-label="Menu"></button>

    <!-- NAVIGATION -->

                <source media="(min-width: 600px)" srcset="images/hero-m.webp">
                <img src="images/hero-s.webp" alt="Collage of people working in a business" width="1000" height="425" fetchpriority=high>

            <section class="cta">
                <h1>Discover the Best Places to Visit in Lima</h1>

        </div>
        <!-- FEATURED PLACES -->
        <div id="allPlaces" class="container">
